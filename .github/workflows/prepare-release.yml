# On every push to main, roll any pending .changeset/*.md files into a release
# PR (bumps package.json, regenerates CHANGELOG.md). Merging that PR triggers
# knope-release.yml. Skipped on knope's own "chore: release" commit to avoid a
# loop.
name: Prepare Release

on:
  push:
    branches: [main]

concurrency: prepare-release

# The default token does nothing here. The branch push and the pull request both
# go through the app token minted below.
permissions:
  contents: read

jobs:
  prepare-release:
    if: "!contains(github.event.head_commit.message, 'chore: release')"
    runs-on: ubuntu-latest
    steps:
      # An app token, not GITHUB_TOKEN: both prior release PRs were opened by
      # the workflow token and their CI run sat awaiting manual approval, so
      # someone had to re-run it by hand before the PR could merge.
      - name: Mint bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SIA_CI_BOT_APP_ID }}
          private-key: ${{ secrets.SIA_CI_BOT_PRIVATE_KEY }}
          # Contents to force-push `release`, pull requests for
          # create-release-pr.mjs. Without the second the branch push succeeds
          # and the PR create fails.
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # knope force-pushes `release` later in the run, using the credentials
          # checkout saves here.
          token: ${{ steps.bot-token.outputs.token }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.22.2

      # knope prepare-release errors when there's nothing to release, which is
      # the normal case for most pushes. Gate on change-file presence instead of
      # swallowing all errors with continue-on-error — so a genuine knope/git
      # failure still fails the run. (ignore_conventional_commits means change
      # files are the only thing that drives a release.)
      - name: Check for pending changes
        id: changes
        run: |
          if ls .changeset/*.md >/dev/null 2>&1; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changes.outputs.pending == 'true'
        run: knope prepare-release --verbose
        env:
          # Read both by knope's own API calls and by the `gh` that
          # create-release-pr.mjs shells out to.
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
